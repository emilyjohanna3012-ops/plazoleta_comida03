<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos · Plazoleta de comidas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/empleado.css">
</head>
<body>
    <header id="encabezado"></header>

    <main class="pagina">
        <div class="contenedor">
            <!-- Encabezado del panel: restaurante del empleado y botón para actualizar -->
            <div class="titulo-pagina">
                <div class="restaurante-panel">
                    <div class="restaurante-panel__logo" id="logo-restaurante"></div>
                    <div>
                        <p class="titulo-pagina__eyebrow">Panel de cocina</p>
                        <h1 id="nombre-restaurante"><span class="esqueleto esqueleto--titulo"></span></h1>
                        <p class="titulo-pagina__sub">Atiende los pedidos en orden de llegada.</p>
                    </div>
                </div>
                <div class="titulo-pagina__acciones">
                    <span class="actualizado" id="actualizado" aria-live="polite"></span>
                    <button class="btn" type="button" id="btn-actualizar"><span data-icono="actualizar"></span><span>Actualizar</span></button>
                </div>
            </div>

            <!-- HU12: un filtro por cada estado del pedido -->
            <div class="pestanas" role="tablist" aria-label="Estado de los pedidos" id="pestanas"></div>

            <!-- Tarjetas de pedidos -->
            <section class="rejilla" id="lista-pedidos" aria-live="polite" aria-busy="true"></section>

            <nav class="paginacion" id="paginacion" aria-label="Paginación" hidden>
                <button class="btn btn--sm" type="button" id="btn-anterior"><span data-icono="izquierda"></span><span>Anterior</span></button>
                <span class="paginacion__texto" id="texto-pagina"></span>
                <button class="btn btn--sm" type="button" id="btn-siguiente"><span>Siguiente</span><span data-icono="derecha"></span></button>
            </nav>
        </div>
    </main>

    <footer id="pie"></footer>
    <script type="module" src="js/paginas/empleado.js"></script>
</body>
</html>
